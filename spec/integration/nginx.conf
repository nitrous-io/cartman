worker_processes  1;
error_log logs/error.log;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  init_by_lua_file lib/setup.lua;

  server {
    listen 6000;
    listen 6001;

    location ~ (/502|/503) {
      root public/;
    }

    location / {
      set $custom_proxy_host '';

      access_by_lua_file lib/handle.lua;

      error_page 502 /502.html;
      error_page 503 /503.html;

      proxy_pass $custom_proxy_host;
      proxy_redirect   off;

      # since we're proxying to same nginx server during testing,
      # set the HOST explicitly to avoid recursion.
      proxy_set_header    Host              127.0.0.1;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade $http_upgrade;
      proxy_set_header    Connection $connection_upgrade;
    }
  }

  # test requests hit here
  server {
    listen 6000;
    server_name 127.0.0.1;

    if ($request_method = POST) {
      return 200;
    }

    root public/;
  }
}
