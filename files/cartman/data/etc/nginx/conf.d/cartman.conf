map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

lua_package_path '/var/action/cartman/lib/?.lua;;';

lua_shared_dict cache 10m; # 10mb of shared memory

init_by_lua_file /var/action/cartman/lib/init.lua;

server {
  listen 65203;
  location /invalidate_cache {
    allow 127.0.0.1;
    deny  all;
    content_by_lua_file /var/action/cartman/lib/invalidate_cache.lua;
  }
}

server {
  listen 80 default_server;
  listen 443 default_server ssl;

  include /etc/nginx/cartman-common.conf;

  ssl_certificate /etc/ssl/certs/nitrouspro.com.crt;
  ssl_certificate_key /etc/ssl/private/nitrouspro.com.key;
}

server {
  server_name nitrouspro.com *.nitrouspro.com;
  listen 80;
  listen 443 ssl;

  include /etc/nginx/cartman-common.conf;

  ssl_certificate /etc/ssl/certs/nitrouspro.com.crt;
  ssl_certificate_key /etc/ssl/private/nitrouspro.com.key;
}
